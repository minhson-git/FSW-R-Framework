[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsw-r-viz"
version = "0.1.0"
description = "Matplotlib stick-figure sanity-check renderer for fsw-r hand poses"
requires-python = ">=3.10"
dependencies = [
    # fsw-r itself is an unpublished local sibling package -- it is not
    # listed here as a version constraint. Install it into this venv first:
    #   pip install -e ../fsw-r
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
