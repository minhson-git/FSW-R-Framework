[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsw-r"
version = "0.1.0"
description = "fsw-renderable: 3D joint-pose rendering layer on top of FSW/ISWA hand symbols"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "signwriting>=0.1.12",
    "numpy>=1.24",
    # Pinned to an EXACT version, not a floor like the deps above:
    # export/pose_export.py depends on this library's internal topology
    # (pose_format.utils.holistic.HAND_POINTS/holistic_components(), read
    # at runtime rather than hardcoded -- see that module's docstring) and
    # its Pose/PoseHeader/NumPyPoseBody constructor shapes. Both the point
    # ordering and the constructor API could change between pose-format
    # versions without a matching change here; pinning exactly makes that a
    # loud install-time conflict instead of a silent landmark-order bug.
    "pose-format==0.14.1",
    # pose_format.utils.holistic (where HAND_POINTS/holistic_components()
    # live -- see the comment above) imports mediapipe just to read its
    # HandLandmark enum names; it raises its own ImportError with an
    # install hint if mediapipe is missing, so pose-format doesn't declare
    # this as a hard dependency itself. fsw_r never runs any actual
    # mediapipe CV pipeline -- this is only here so the point-NAME lookup
    # this task's brief requires ("đọc từ thư viện, đừng gõ tay danh sách")
    # is importable at all. Upper-bounded to match pose-format 0.14.1's own
    # documented requirement.
    "mediapipe<0.10.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]
# Only needed to run scripts/gen_valid_combinations.py (regenerating
# data/iswa_valid_combinations.json from the ISWA font) -- not a runtime
# dependency of fsw_r itself.
scripts = [
    "fonttools>=4.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsw_r = ["py.typed"]
"fsw_r.data" = ["*.json"]

[tool.mypy]
strict = true
# scripts/export_joint_poses.py is excluded: it's a frozen historical
# record of a one-time migration (see its own docstring) whose imports
# (the since-deleted groups/ package) no longer resolve.
files = [
    "src",
    "tests",
    "scripts/gen_valid_combinations.py",
    "scripts/gen_face_poses.py",
    "scripts/fetch_ground_truth.py",
    "scripts/eval_fk_accuracy.py",
    "scripts/eval_anatomical.py",
]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "signwriting.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pose_format.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mediapipe.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# So tests/test_eval_*.py can "import eval_fk_accuracy"/"import
# eval_anatomical" directly -- scripts/ is not a package (no __init__.py,
# deliberately: these are one-shot report generators, not library code),
# so this is the standard pytest mechanism for that instead of sys.path
# hacks inside the test files themselves.
pythonpath = ["scripts"]
