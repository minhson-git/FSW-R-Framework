[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsw-r"
version = "0.1.0"
description = "fsw-renderable: 3D joint-pose rendering layer on top of FSW/ISWA hand symbols"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "signwriting>=0.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsw_r = ["py.typed"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "signwriting.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
