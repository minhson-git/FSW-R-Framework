[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsw-r"
version = "0.1.0"
description = "fsw-renderable: 3D joint-pose rendering layer on top of FSW/ISWA hand symbols"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "signwriting>=0.1.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]
# Only needed to run scripts/gen_valid_combinations.py (regenerating
# data/iswa_valid_combinations.json from the ISWA font) -- not a runtime
# dependency of fsw_r itself.
scripts = [
    "fonttools>=4.50",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsw_r = ["py.typed"]
"fsw_r.data" = ["*.json"]

[tool.mypy]
strict = true
# scripts/export_joint_poses.py is excluded: it's a frozen historical
# record of a one-time migration (see its own docstring) whose imports
# (the since-deleted groups/ package) no longer resolve.
files = ["src", "tests", "scripts/gen_valid_combinations.py"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "signwriting.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
